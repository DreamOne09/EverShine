name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application (dist + Pages Functions)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://bapwzqmlvwwmnucjimsn.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhcHd6cW1sdnd3bW51Y2ppbXNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4OTY3NzgsImV4cCI6MjA4MTQ3Mjc3OH0.lGgudUHGUb14wt-N_fyLSgaML9-DPG4qeHJ5npsRUDQ' }}
          VITE_CLAIM_PASSWORD: ${{ secrets.VITE_CLAIM_PASSWORD || 'evershine' }}
        run: npm run build

      - name: Check Cloudflare credentials
        id: cf_creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::尚未在 GitHub Secrets 設定 CLOUDFLARE_API_TOKEN 與 CLOUDFLARE_ACCOUNT_ID，已略過 GitHub Action 端部署（若已在 Cloudflare Dashboard 直接連結 GitHub 儲存庫則會由 Cloudflare 自動部署）。"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf_creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME || 'evershine' }} --branch=main
