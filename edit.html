<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>會員資料編輯 - BNI 長輝白金分會</title>
    <meta name="description" content="BNI 長輝白金分會會員資料編輯介面">
    <meta name="robots" content="noindex, nofollow">

    <!-- Resource Hints for Performance -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Security and Performance -->
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="images/assets/logo/白色正方形logo.png">
    <link rel="apple-touch-icon" href="images/assets/logo/白色正方形logo.png">

    <!-- Critical Inline Styles -->
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            color: #f4f9ff;
            font-family: 'Noto Sans TC', sans-serif;
            background: transparent;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .global-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            z-index: -10;
            pointer-events: none;
        }
    </style>

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css?v=20251130">
    <link rel="stylesheet" href="css/custom-additions.css?v=20251130">

    <!-- Fonts -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap"
        as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap"
            rel="stylesheet">
    </noscript>

    <style>
        /* Page Header */
        .simple-header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-logo {
            height: 40px;
            width: auto;
        }

        .back-link {
            color: var(--text-gray);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: var(--color-primary);
        }

        /* Container */
        .edit-container {
            max-width: 800px;
            margin: 3rem auto 5rem;
            padding: 0 1.5rem;
        }

        .page-title {
            color: #fff;
            text-align: center;
            margin-bottom: 2.5rem;
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(76, 168, 223, 0.3);
        }

        /* Sections */
        .edit-section {
            margin-bottom: 2rem;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(76, 168, 223, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .edit-section:hover {
            border-color: rgba(76, 168, 223, 0.4);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .edit-section h2 {
            color: var(--color-primary);
            margin-bottom: 1.5rem;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid rgba(76, 168, 223, 0.2);
            padding-bottom: 1rem;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #e0e0e0;
            margin-bottom: 0.6rem;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(76, 168, 223, 0.3);
            border-radius: 10px;
            color: #fff;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(76, 168, 223, 0.2);
            background: rgba(0, 0, 0, 0.5);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.6;
        }

        .form-group small {
            display: block;
            color: var(--text-gray);
            margin-top: 0.5rem;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 2.5rem;
        }

        .btn {
            flex: 1;
            padding: 1rem 2rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-primary), #2980b9);
            color: #fff;
            box-shadow: 0 4px 15px rgba(76, 168, 223, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 168, 223, 0.5);
            background: linear-gradient(135deg, #5db5e8, #3498db);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Utilities */
        .char-counter {
            text-align: right;
            color: var(--text-gray);
            font-size: 0.85rem;
            margin-top: 0.4rem;
        }

        .error-message {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            padding: 1rem;
            border-radius: 10px;
            margin-top: 1.5rem;
            border: 1px solid rgba(255, 107, 107, 0.2);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .success-message {
            color: #51cf66;
            background: rgba(81, 207, 102, 0.1);
            padding: 1rem;
            border-radius: 10px;
            margin-top: 1.5rem;
            border: 1px solid rgba(81, 207, 102, 0.2);
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .link-inputs {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .readonly-field {
            background: rgba(255, 255, 255, 0.05) !important;
            cursor: not-allowed;
            color: var(--text-gray) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .edit-container {
                margin: 2rem auto;
                padding: 0 1rem;
            }

            .edit-section {
                padding: 1.5rem;
            }

            .link-inputs {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }

            .page-title {
                font-size: 1.75rem;
            }
        }
    </style>
</head>

<body>
    <!-- 全局背景層 -->
    <div class="global-background"></div>
    <!-- Canvas 星空背景 -->
    <canvas id="starrySkyCanvas" aria-hidden="true"></canvas>

    <!-- 簡易 Header -->
    <header class="simple-header">
        <a href="/" title="回首頁">
            <img src="images/assets/logo/透明底白字長條logo.png" alt="BNI EverShine" class="header-logo">
        </a>
        <a href="/" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            回首頁
        </a>
    </header>

    <div class="edit-container">
        <h1 class="page-title">會員資料編輯</h1>

        <!-- 身份驗證 -->
        <div class="edit-section" id="auth-section">
            <h2>🔐 身份驗證</h2>
            <div class="form-group">
                <label for="member-name">請輸入您的姓名 *</label>
                <input type="text" id="member-name" placeholder="例如：李孟亦" required autocomplete="name">
                <small>請輸入您在會員名單中的姓名</small>
            </div>
            <div class="form-group">
                <label for="verification-code">PIN 碼 *</label>
                <input type="password" id="verification-code" placeholder="請輸入 PIN 碼" required>
                <small>預設 PIN 碼：追求夢想得第一</small>
            </div>
            <button class="btn btn-primary" onclick="loadMemberData()" id="load-btn">
                載入我的資料
            </button>
            <div id="auth-message"></div>
        </div>

        <!-- 編輯表單（初始隱藏） -->
        <div id="edit-form" style="display: none;">
            <!-- 基本資料 -->
            <div class="edit-section">
                <h2>💼 基本資料</h2>
                <div class="form-group">
                    <label for="name">姓名</label>
                    <input type="text" id="name" class="readonly-field" readonly>
                    <small>姓名無法修改，如需修改請聯繫管理員</small>
                </div>
                <div class="form-group">
                    <label for="industry">行業別</label>
                    <input type="text" id="industry" class="readonly-field" readonly>
                    <small>行業別無法修改，如需修改請聯繫管理員</small>
                </div>
                <div class="form-group">
                    <label for="company">公司名稱 *</label>
                    <input type="text" id="company" maxlength="50" required placeholder="請輸入完整公司名稱">
                    <small>最多 50 字</small>
                </div>
                <div class="form-group">
                    <label for="position">職稱 *</label>
                    <input type="text" id="position" maxlength="30" required placeholder="例如：總經理、創辦人">
                    <small>最多 30 字</small>
                </div>
            </div>

            <!-- 自我介紹 -->
            <div class="edit-section">
                <h2>✍️ 自我介紹</h2>
                <div class="form-group">
                    <label for="short-intro">簡短介紹 *</label>
                    <textarea id="short-intro" maxlength="100" required placeholder="請用一句話介紹您的專業（顯示於列表卡片）"
                        oninput="updateCharCounter('short-intro', 100)"></textarea>
                    <div class="char-counter" id="short-intro-counter">0 / 100</div>
                </div>
                <div class="form-group">
                    <label for="full-intro">完整介紹 *</label>
                    <textarea id="full-intro" maxlength="500" required placeholder="請詳細介紹您的服務內容、優勢與目標客戶（顯示於詳細頁面）"
                        oninput="updateCharCounter('full-intro', 500)" style="min-height: 200px;"></textarea>
                    <small>建議 200-500 字，越詳細越有助於引薦</small>
                    <div class="char-counter" id="full-intro-counter">0 / 500</div>
                </div>
            </div>

            <!-- 公司連結 -->
            <div class="edit-section">
                <h2>🔗 公司連結</h2>
                <p style="color: var(--text-gray); font-size: 0.9rem; margin-bottom: 1.5rem;">
                    請提供您的網站或社群媒體連結，增加曝光機會（最多3個）
                </p>
                <div class="link-inputs">
                    <select id="link1-type">
                        <option value="">選擇類型</option>
                        <option value="website">官方網站</option>
                        <option value="facebook">Facebook</option>
                        <option value="instagram">Instagram</option>
                        <option value="linkedin">LinkedIn</option>
                        <option value="line">LINE</option>
                        <option value="youtube">YouTube</option>
                    </select>
                    <input type="url" id="link1-url" placeholder="https://...">
                </div>
                <div class="link-inputs">
                    <select id="link2-type">
                        <option value="">選擇類型</option>
                        <option value="website">官方網站</option>
                        <option value="facebook">Facebook</option>
                        <option value="instagram">Instagram</option>
                        <option value="linkedin">LinkedIn</option>
                        <option value="line">LINE</option>
                        <option value="youtube">YouTube</option>
                    </select>
                    <input type="url" id="link2-url" placeholder="https://...">
                </div>
                <div class="link-inputs">
                    <select id="link3-type">
                        <option value="">選擇類型</option>
                        <option value="website">官方網站</option>
                        <option value="facebook">Facebook</option>
                        <option value="instagram">Instagram</option>
                        <option value="linkedin">LinkedIn</option>
                        <option value="line">LINE</option>
                        <option value="youtube">YouTube</option>
                    </select>
                    <input type="url" id="link3-url" placeholder="https://...">
                </div>
            </div>

            <!-- 儲存按鈕 -->
            <div class="btn-group">
                <button class="btn btn-primary" onclick="saveData()" id="save-btn">
                    📧 產生更新郵件
                </button>
            </div>

            <p style="text-align: center; color: var(--text-gray); margin-top: 1rem; font-size: 0.9rem;">
                點擊後將開啟您的郵件軟體，請直接發送給管理員即可完成申請。
            </p>

            <div id="message-area"></div>
        </div>
    </div>

    <!-- GitHub API 相關腳本 -->
    <script src="js/github-config.js"></script>
    <script src="js/github-api.js"></script>

    <script>
        let currentMember = null;
        let githubAPI = null;

        // 初始化 GitHub API
        function initGitHubAPI() {
            if (typeof GITHUB_CONFIG === 'undefined') {
                showMessage('GitHub 配置未載入', 'error', 'auth-message');
                return false;
            }

            githubAPI = new GitHubAPI(GITHUB_CONFIG);
            return true;
        }

        // 載入會員資料
        async function loadMemberData() {
            const name = document.getElementById('member-name').value.trim();
            const pin = document.getElementById('verification-code').value.trim();
            const loadBtn = document.getElementById('load-btn');

            if (!name || !pin) {
                showMessage('請輸入姓名和 PIN 碼', 'error', 'auth-message');
                return;
            }

            if (!initGitHubAPI()) {
                return;
            }

            try {
                loadBtn.disabled = true;
                loadBtn.innerHTML = '<span class="loading"></span> 驗證中...';

                // 驗證 PIN 碼並載入資料
                const member = await githubAPI.verifyPin(name, pin);
                currentMember = member;

                // 儲存資訊供後續使用
                sessionStorage.setItem('memberName', name);
                sessionStorage.setItem('memberPin', pin);

                // 填充表單
                populateForm(member);

                // 顯示編輯表單
                document.getElementById('auth-section').style.display = 'none';
                const editForm = document.getElementById('edit-form');
                editForm.style.display = 'block';

                // 平滑滾動到頂部
                window.scrollTo({ top: 0, behavior: 'smooth' });

                showMessage('資料載入成功！', 'success', 'message-area');
            } catch (error) {
                console.error('載入失敗:', error);
                showMessage(error.message || '載入失敗，請檢查姓名和 PIN 碼是否正確', 'error', 'auth-message');
            } finally {
                loadBtn.disabled = false;
                loadBtn.textContent = '載入我的資料';
            }
        }

        // 填充表單
        function populateForm(member) {
            document.getElementById('name').value = member.name || '';
            document.getElementById('industry').value = member.industry || '';
            document.getElementById('company').value = member.company || '';
            document.getElementById('position').value = member.position || '';
            document.getElementById('short-intro').value = member.shortIntro || '';
            document.getElementById('full-intro').value = member.fullIntro || '';

            updateCharCounter('short-intro', 100);
            updateCharCounter('full-intro', 500);

            // 填充連結
            if (member.links && member.links.length > 0) {
                member.links.forEach((link, index) => {
                    if (index < 3) {
                        document.getElementById(`link${index + 1}-type`).value = link.type || '';
                        document.getElementById(`link${index + 1}-url`).value = link.url || '';
                    }
                });
            }
        }

        // 更新字數計數器
        function updateCharCounter(id, max) {
            const textarea = document.getElementById(id);
            const counter = document.getElementById(id + '-counter');
            if (textarea && counter) {
                const length = textarea.value.length;
                counter.textContent = `${length} / ${max}`;
                counter.style.color = length > max * 0.9 ? '#ff6b6b' : 'var(--text-gray)';
            }
        }

        // 收集表單資料
        function collectData() {
            const links = [];

            for (let i = 1; i <= 3; i++) {
                const type = document.getElementById(`link${i}-type`).value;
                const url = document.getElementById(`link${i}-url`).value;
                if (type && url) {
                    links.push({ type, url, icon: type });
                }
            }

            return {
                company: document.getElementById('company').value.trim(),
                position: document.getElementById('position').value.trim(),
                title: `${document.getElementById('position').value.trim()} - ${document.getElementById('company').value.trim()}`,
                shortIntro: document.getElementById('short-intro').value.trim(),
                fullIntro: document.getElementById('full-intro').value.trim(),
                links: links
            };
        }

        // 儲存資料
        async function saveData() {
            const data = collectData();
            const errors = validateData(data);

            if (errors.length > 0) {
                showMessage('請修正以下錯誤：\n' + errors.join('\n'), 'error', 'message-area');
                return;
            }

            const memberName = sessionStorage.getItem('memberName');

            if (!memberName) {
                showMessage('請重新登入', 'error', 'message-area');
                return;
            }

            const saveBtn = document.getElementById('save-btn');

            try {
                saveBtn.disabled = true;
                saveBtn.innerHTML = '<span class="loading"></span> 準備郵件...';

                // 準備郵件內容
                const subject = `[會員資料更新] ${memberName}`;
                const body = `親愛的管理員您好，

我是 ${memberName}，我想要更新我的會員資料。
以下是更新後的資料內容（JSON格式）：

${JSON.stringify(data, null, 2)}

請協助更新網站，謝謝！`;

                // 生成 mailto 連結
                // 請填入管理員的 Email
                const adminEmail = 'service@evershine.tw';
                const mailtoUrl = `mailto:${adminEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

                // 開啟郵件軟體
                window.location.href = mailtoUrl;

                showMessage('✅ 已開啟您的郵件軟體。請確認內容後發送郵件給管理員。', 'success', 'message-area');

            } catch (error) {
                console.error('準備提交失敗:', error);
                showMessage('準備提交失敗：' + (error.message || '未知錯誤'), 'error', 'message-area');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '📧 產生更新郵件';
            }
        }

        // 驗證資料
        function validateData(data) {
            const errors = [];

            if (!data.company) errors.push('- 公司名稱為必填');
            if (!data.position) errors.push('- 職稱為必填');
            if (!data.shortIntro) errors.push('- 簡短介紹為必填');
            if (data.shortIntro && data.shortIntro.length > 100) errors.push('- 簡短介紹不可超過100字');
            if (!data.fullIntro) errors.push('- 完整介紹為必填');
            if (data.fullIntro && data.fullIntro.length < 50) {
                errors.push('- 完整介紹至少需要50字');
            }
            if (data.fullIntro && data.fullIntro.length > 500) {
                errors.push('- 完整介紹不可超過500字');
            }

            return errors;
        }

        // 顯示訊息
        function showMessage(message, type, targetId = 'message-area') {
            const messageArea = document.getElementById(targetId);
            messageArea.className = type === 'error' ? 'error-message' : 'success-message';
            messageArea.textContent = message;
            messageArea.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    messageArea.style.display = 'none';
                }, 5000);
            }
        }
    </script>

    <script src="js/components.js?v=20251130" defer></script>
    <script src="js/starry-background-unified.js?v=20251130" defer></script>
</body>

</html>
