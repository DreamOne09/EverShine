        <section style="margin-bottom:30px;">
          <h2>關於 BNI 長輝白金分會</h2>
          <p>BNI 長輝白金分會隸屬全球最大商務引薦組織 BNI（Business Network International）。我們每週三早上 06:30–08:30 全程在 Zoom 上開會，每個專業領域只收一位代表，讓將近 60 位不同產業的企業主能安心為彼此介紹客戶、促成跨業合作。</p>
        </section>

          <p>長輝從創會就把例會設計在線上：不用清晨趕車去飯店，出差或在外縣市也能照常出席；90 分鐘固定議程搭配 Zoom 分組討論室與平時一對一交流，八點半散會後直接開始跑當天的業務。</p>
        </section>

        <section style="margin-bottom:30px;">
          <h2>什麼是 BNI？</h2>
          <p>BNI 成立於 1985 年，遍及 76+ 個國家與地區，擁有 11,300+ 個分會與 34 萬+ 名企業主會員，核心精神為「付出者收穫」（Givers Gain®）。在台灣共有 245 個分會、近萬名會員，過去 12 個月累計超過 72 萬張引薦單、成交金額逾 253 億新台幣。</p>
        </section>

            <li><strong>一業一代表</strong>：每個專業只收一位，分會裡的同類需求不搶單</li>
            <li><strong>全程 Zoom 與會</strong>：省去通勤時間，跨縣市與出差都能穩定出席</li>
            <li><strong>八大產業鏈</strong>：涵蓋工程、行銷、健康、金融、科技、教育、生活、法稅</li>
            <li><strong>實名引薦追蹤</strong>：每張引薦單與成交金額皆有紀錄與核查</li>
          </ul>
        </section>

        <section style="margin-bottom:30px;">

          <h3>加入 BNI 長輝分會需要什麼資格？</h3>
          <p>我們以 321A 四項標準審核：3 年以上行業實務經驗、公司營運滿 2 年、在分會專注登記 1 項專業、以及願意先幫夥伴的態度。</p>

          <p>來賓參觀免費，不用準備投影片，只要準備 30 秒口頭自我介紹與基本聯絡資訊即可。</p>
